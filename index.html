<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Seat</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>

<div class="container">

    <h1 id="coupleName">Welcome to Our Wedding</h1>

    <p class="subtitle">
        Find your table below
    </p>

    <div class="search-container">

        <input
            type="text"
            id="guestSearch"
            placeholder="Enter your name..."
            autocomplete="off"
        >

        <div id="suggestions"></div>

    </div>

    <div id="result"></div>

    <h2>Seating Plan</h2>

    <div id="seatingChart">

        <div class="table" data-table="1">1</div>
        <div class="table" data-table="2">2</div>
        <div class="table" data-table="3">3</div>
        <div class="table" data-table="4">4</div>
        <div class="table" data-table="5">5</div>
        <div class="table" data-table="6">6</div>
        <div class="table" data-table="7">7</div>
        <div class="table" data-table="8">8</div>
        <div class="table" data-table="9">9</div>
        <div class="table" data-table="10">10</div>
        <div class="table" data-table="11">11</div>
        <div class="table" data-table="12">12</div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
